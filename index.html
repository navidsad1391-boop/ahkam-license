<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل ربات احکام تجارت</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, sans-serif; }
body { background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; padding: 20px; }
.container { max-width: 800px; margin: 0 auto; }
.card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 20px; }
h1 { color: #333; text-align: center; margin-bottom: 10px; }
h2 { color: #667eea; margin-bottom: 15px; }
input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; font-family: monospace; }
label { color: #555; font-weight: bold; display: block; margin-top: 10px; }
button { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 15px; width: 100%; }
.btn-copy { background: #4caf50; padding: 8px 15px; font-size: 13px; }
.btn-refresh { background: #ff9800; padding: 8px 15px; font-size: 13px; margin: 0 5px; }
.code-box { background: #333; color: #4caf50; padding: 12px; border-radius: 8px; font-family: monospace; margin: 8px 0; font-size: 15px; text-align: center; letter-spacing: 2px; }
.result { background: #e8f5e9; border: 2px solid #4caf50; padding: 15px; border-radius: 10px; margin-top: 15px; }
.license-item { background: #f5f5f5; padding: 12px; margin: 8px 0; border-radius: 8px; border-right: 4px solid #667eea; }
.instructions { background: #fff3cd; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
.step { background: white; padding: 10px; margin: 5px 0; border-radius: 5px; }
</style>
</head>
<body>
<div class="container">

<div class="card">
  <h1>🤖 پنل ربات احکام تجارت</h1>
  <p style="text-align:center;color:#666;">ساخت و مدیریت کدهای فعال‌سازی</p>
</div>

<div class="card">
  <h2>✨ ساخت کد جدید</h2>
  
  <label>نام مشتری:</label>
  <input type="text" id="custName" placeholder="مثلا: احمد رضایی" style="font-family: Tahoma;">
  
  <label>شماره تماس:</label>
  <input type="text" id="custPhone" placeholder="09123456789">
  
  <label>شهر:</label>
  <input type="text" id="custCity" placeholder="مثلا: تهران" style="font-family: Tahoma;">
  
  <label>مدت زمان:</label>
  <select id="duration" style="font-family: Tahoma;">
    <option value="7">7 روز - 150,000 تومان</option>
    <option value="30" selected>30 روز - 300,000 تومان</option>
    <option value="90">90 روز - 700,000 تومان</option>
    <option value="365">1 سال - 2,000,000 تومان</option>
    <option value="9999">نامحدود - 5,000,000 تومان</option>
  </select>
  
  <label>قیمت (تومان):</label>
  <input type="number" id="price" value="300000">
  
  <button onclick="generateCode()">🔑 ساخت کد + کپی JSON</button>
  
  <div id="result"></div>
</div>

<div class="card">
  <h2>📋 نحوه استفاده</h2>
  <div class="instructions">
    <div class="step"><b>1.</b> فرم بالا را پر کن</div>
    <div class="step"><b>2.</b> دکمه "ساخت کد" را بزن</div>
    <div class="step"><b>3.</b> کد JSON را کپی کن</div>
    <div class="step"><b>4.</b> روی دکمه "ویرایش licenses.json" بزن</div>
    <div class="step"><b>5.</b> قبل از <code>]</code> آخر، کاما بذار و JSON را paste کن</div>
    <div class="step"><b>6.</b> Commit بزن</div>
    <div class="step"><b>7.</b> کد را به مشتری بده!</div>
  </div>
  
  <a href="https://github.com/navidsad1391-boop/ahkam-license/edit/main/licenses.json" target="_blank" style="display:block;text-decoration:none;">
    <button>📝 ویرایش licenses.json در گیت‌هاب</button>
  </a>
  
  <a href="https://raw.githubusercontent.com/navidsad1391-boop/ahkam-license/main/licenses.json" target="_blank" style="display:block;text-decoration:none;margin-top:10px;">
    <button style="background: #ff9800;">👁️ مشاهده کدهای فعلی</button>
  </a>
</div>

<div class="card">
  <h2>📊 کدهای موجود</h2>
  <button onclick="loadLicenses()" class="btn-refresh">🔄 بارگذاری</button>
  <div id="licensesList"></div>
</div>

</div>

<script>
function generateCode() {
    const name = document.getElementById('custName').value || "بدون نام";
    const phone = document.getElementById('custPhone').value || "---";
    const city = document.getElementById('custCity').value || "---";
    const duration = parseInt(document.getElementById('duration').value) || 30;
    const price = parseInt(document.getElementById('price').value) || 0;
    
    // ساخت کد یکتا
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = 'KAFI-';
    for (let i = 0; i < 4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
    code += '-';
    for (let i = 0; i < 4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
    
    // تاریخ
    const today = new Date();
    const created = today.toISOString().split('T')[0];
    
    let expires;
    if (duration >= 9999) {
        expires = "2099-12-31";
    } else {
        const expDate = new Date();
        expDate.setDate(today.getDate() + duration);
        expires = expDate.toISOString().split('T')[0];
    }
    
    // ساخت JSON
    const jsonEntry = `,
    {
      "code": "${code}",
      "customer": "${name}",
      "phone": "${phone}",
      "city": "${city}",
      "created": "${created}",
      "expires": "${expires}",
      "duration_days": ${duration},
      "active": true,
      "price": ${price}
    }`;
    
    document.getElementById('result').innerHTML = `
        <div class="result">
            <h3 style="color:#2e7d32;margin-bottom:10px;">✅ کد ساخته شد!</h3>
            <div class="code-box">${code}</div>
            <button onclick="copyText('${code}')" class="btn-copy">📋 کپی کد</button>
            
            <h4 style="margin-top:20px;color:#333;">📝 JSON آماده برای paste در GitHub:</h4>
            <textarea id="jsonOutput" rows="12" readonly style="direction:ltr;text-align:left;">${jsonEntry}</textarea>
            <button onclick="copyJSON()" class="btn-copy">📋 کپی JSON</button>
            
            <div style="background:#fff3cd;padding:15px;margin-top:15px;border-radius:8px;">
                <b>مراحل بعدی:</b><br>
                1. دکمه "کپی JSON" را بزن<br>
                2. روی "ویرایش licenses.json" کلیک کن<br>
                3. قبل از <code>]</code> آخر، JSON را paste کن<br>
                4. Commit changes بزن<br>
                5. کد <b>${code}</b> را به مشتری بده
            </div>
        </div>
    `;
}

function copyText(text) {
    navigator.clipboard.writeText(text).then(() => {
        alert("✅ کد کپی شد: " + text);
    });
}

function copyJSON() {
    const textarea = document.getElementById('jsonOutput');
    textarea.select();
    document.execCommand('copy');
    alert("✅ JSON کپی شد! حالا در GitHub paste کن");
}

async function loadLicenses() {
    const listDiv = document.getElementById('licensesList');
    listDiv.innerHTML = '<p style="text-align:center;color:#999;">در حال بارگذاری...</p>';
    
    try {
        const url = 'https://raw.githubusercontent.com/navidsad1391-boop/ahkam-license/main/licenses.json?t=' + Date.now();
        const response = await fetch(url);
        const data = await response.json();
        
        listDiv.innerHTML = '';
        
        if (data.licenses && data.licenses.length > 0) {
            data.licenses.forEach(lic => {
                const item = document.createElement('div');
                item.className = 'license-item';
                item.innerHTML = `
                    <div class="code-box" style="font-size:14px;">${lic.code}</div>
                    <p><b>مشتری:</b> ${lic.customer || '---'}</p>
                    <p><b>تلفن:</b> ${lic.phone || '---'} | <b>شهر:</b> ${lic.city || '---'}</p>
                    <p><b>ساخت:</b> ${lic.created} | <b>انقضا:</b> ${lic.expires}</p>
                    <p><b>وضعیت:</b> ${lic.active ? '✅ فعال' : '❌ غیرفعال'} | <b>قیمت:</b> ${lic.price ? lic.price.toLocaleString() : 0} تومان</p>
                    <button onclick="copyText('${lic.code}')" class="btn-copy">📋 کپی کد</button>
                `;
                listDiv.appendChild(item);
            });
        } else {
            listDiv.innerHTML = '<p style="text-align:center;color:#999;">هیچ کدی موجود نیست</p>';
        }
    } catch (e) {
        listDiv.innerHTML = `<p style="color:red;">خطا: ${e.message}</p>`;
    }
}

// بارگذاری خودکار
window.addEventListener('load', loadLicenses);
</script>

</body>
</html>
