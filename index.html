<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت ربات احکام تجارت</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, sans-serif; }
body { background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; padding: 20px; }
.container { max-width: 900px; margin: 0 auto; }
.header { background: white; padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
.header h1 { color: #333; font-size: 24px; }
.header p { color: #666; margin-top: 10px; }
.login-box, .panel { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
.hidden { display: none; }
input, select { width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; }
input:focus, select:focus { outline: none; border-color: #667eea; }
label { color: #555; font-weight: bold; display: block; margin-top: 10px; }
button { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 15px; width: 100%; }
button:hover { opacity: 0.9; }
.btn-small { padding: 5px 10px; font-size: 12px; width: auto; margin: 2px; }
.btn-copy { background: #4caf50; }
.btn-delete { background: #f44336; }
.btn-edit { background: #ff9800; }
.stats { display: flex; gap: 15px; margin: 20px 0; }
.stat-box { flex: 1; background: #f5f5f5; padding: 15px; border-radius: 10px; text-align: center; }
.stat-box h3 { color: #667eea; font-size: 28px; }
.stat-box p { color: #666; margin-top: 5px; }
.license-card { background: #f9f9f9; border-right: 5px solid #667eea; padding: 15px; margin: 10px 0; border-radius: 8px; }
.license-card.expired { border-right-color: #f44336; opacity: 0.7; }
.license-card h4 { color: #333; }
.license-card p { color: #666; font-size: 13px; margin: 3px 0; }
.code-box { background: #333; color: #4caf50; padding: 10px; border-radius: 5px; font-family: monospace; margin: 5px 0; font-size: 14px; }
.result-box { background: #e8f5e9; border: 2px solid #4caf50; padding: 20px; border-radius: 10px; margin: 15px 0; text-align: center; }
.result-box h3 { color: #2e7d32; }
.error { background: #ffebee; color: #c62828; padding: 10px; border-radius: 8px; margin: 10px 0; }
.warning { background: #fff3e0; color: #e65100; padding: 10px; border-radius: 8px; margin: 10px 0; }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🤖 پنل مدیریت ربات احکام تجارت</h1>
        <p>مدیریت لایسنس‌های مشتریان</p>
    </div>

    <!-- صفحه ورود -->
    <div id="loginBox" class="login-box">
        <h2 style="text-align:center; color:#333;">🔐 ورود مدیر</h2>
        <label>رمز عبور:</label>
        <input type="password" id="adminPass" placeholder="رمز مدیر را وارد کنید">
        <label>GitHub Token:</label>
        <input type="password" id="ghToken" placeholder="Personal Access Token">
        <button onclick="login()">ورود</button>
        <p style="color:#999; font-size:12px; text-align:center; margin-top:15px;">
            برای اضافه/حذف کد نیاز به Token دارید
        </p>
    </div>

    <!-- پنل اصلی -->
    <div id="mainPanel" class="hidden">
        <div class="panel">
            <div class="stats">
                <div class="stat-box">
                    <h3 id="totalCodes">0</h3>
                    <p>کل کدها</p>
                </div>
                <div class="stat-box">
                    <h3 id="activeCodes" style="color:#4caf50;">0</h3>
                    <p>فعال</p>
                </div>
                <div class="stat-box">
                    <h3 id="expiredCodes" style="color:#f44336;">0</h3>
                    <p>منقضی</p>
                </div>
            </div>

            <h2 style="color:#333; margin:20px 0 10px;">➕ ساخت کد جدید</h2>
            <label>نام مشتری:</label>
            <input type="text" id="custName" placeholder="مثلا: کافی‌نت اصفهان">
            
            <label>شماره تماس:</label>
            <input type="text" id="custPhone" placeholder="09xxxxxxxxx">
            
            <label>شهر:</label>
            <input type="text" id="custCity" placeholder="مثلا: اصفهان">
            
            <label>مدت زمان:</label>
            <select id="duration">
                <option value="7">۷ روز - ۱۵۰,۰۰۰ تومان</option>
                <option value="30" selected>۳۰ روز - ۳۰۰,۰۰۰ تومان</option>
                <option value="90">۹۰ روز - ۷۰۰,۰۰۰ تومان</option>
                <option value="365">۱ سال - ۲,۰۰۰,۰۰۰ تومان</option>
                <option value="9999">نامحدود - ۵,۰۰۰,۰۰۰ تومان</option>
            </select>
            
            <label>قیمت (تومان):</label>
            <input type="number" id="price" value="300000">
            
            <button onclick="createLicense()">🔑 ساخت کد جدید</button>
            
            <div id="resultArea"></div>
        </div>

        <div class="panel" style="margin-top:20px;">
            <h2 style="color:#333;">📋 لیست کدها</h2>
            <button onclick="loadLicenses()" style="width:auto; padding:8px 15px; font-size:13px;">🔄 بروزرسانی</button>
            <div id="licensesList"></div>
        </div>
    </div>
</div>

<script>
const GITHUB_USER = "navidsad1391-boop";
const GITHUB_REPO = "ahkam-license";
const ADMIN_PASSWORD = "1234"; // این رمز را عوض کن!

let ghToken = "";
let currentData = null;
let fileSha = "";

function login() {
    const pass = document.getElementById('adminPass').value;
    const token = document.getElementById('ghToken').value;
    
    if (pass !== ADMIN_PASSWORD) {
        alert("❌ رمز اشتباه است!");
        return;
    }
    
    ghToken = token;
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('mainPanel').classList.remove('hidden');
    loadLicenses();
}

async function loadLicenses() {
    try {
        const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/licenses.json`, {
            headers: ghToken ? { 'Authorization': `token ${ghToken}` } : {}
        });
        const data = await response.json();
        fileSha = data.sha;
        currentData = JSON.parse(decodeURIComponent(escape(atob(data.content))));
        displayLicenses();
    } catch (e) {
        alert("خطا در دریافت اطلاعات: " + e.message);
    }
}

function displayLicenses() {
    const list = document.getElementById('licensesList');
    list.innerHTML = '';
    
    let active = 0, expired = 0;
    const today = new Date();
    
    currentData.licenses.forEach((lic, idx) => {
        const expDate = new Date(lic.expires);
        const isExpired = expDate < today && lic.expires !== "2099-12-31";
        
        if (isExpired || !lic.active) expired++;
        else active++;
        
        const daysLeft = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));
        
        const card = document.createElement('div');
        card.className = 'license-card' + (isExpired ? ' expired' : '');
        card.innerHTML = `
            <h4>${isExpired ? '❌' : '✅'} ${lic.customer}</h4>
            <div class="code-box">${lic.code}</div>
            <p>📱 ${lic.phone} | 🏙️ ${lic.city}</p>
            <p>📅 تاریخ ساخت: ${lic.created} | ⏰ انقضا: ${lic.expires}</p>
            <p>${isExpired ? '❌ منقضی شده' : `⏳ ${daysLeft} روز باقیمانده`} | 💰 ${lic.price.toLocaleString()} تومان</p>
            <button class="btn-small btn-copy" onclick="copyCode('${lic.code}')">📋 کپی</button>
            <button class="btn-small btn-delete" onclick="deleteLicense(${idx})">❌ حذف</button>
        `;
        list.appendChild(card);
    });
    
    document.getElementById('totalCodes').innerText = currentData.licenses.length;
    document.getElementById('activeCodes').innerText = active;
    document.getElementById('expiredCodes').innerText = expired;
}

function generateCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = 'KAFI-';
    for (let i = 0; i < 4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
    code += '-';
    for (let i = 0; i < 4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
    return code;
}

async function createLicense() {
    if (!ghToken) {
        alert("❌ برای ساخت کد به GitHub Token نیاز داری!");
        return;
    }
    
    const name = document.getElementById('custName').value;
    const phone = document.getElementById('custPhone').value;
    const city = document.getElementById('custCity').value;
    const duration = parseInt(document.getElementById('duration').value);
    const price = parseInt(document.getElementById('price').value);
    
    if (!name || !phone) {
        alert("❌ نام و شماره را وارد کن!");
        return;
    }
    
    const code = generateCode();
    const today = new Date();
    const expires = new Date();
    if (duration >= 9999) {
        expires.setFullYear(2099);
    } else {
        expires.setDate(today.getDate() + duration);
    }
    
    const newLic = {
        code: code,
        customer: name,
        phone: phone,
        city: city,
        created: today.toISOString().split('T')[0],
        expires: expires.toISOString().split('T')[0],
        duration_days: duration,
        active: true,
        price: price
    };
    
    currentData.licenses.push(newLic);
    await saveToGithub();
    
    document.getElementById('resultArea').innerHTML = `
        <div class="result-box">
            <h3>✅ کد ساخته شد!</h3>
            <div class="code-box" style="font-size:20px;">${code}</div>
            <button onclick="copyCode('${code}')">📋 کپی کد</button>
        </div>
    `;
    
    document.getElementById('custName').value = '';
    document.getElementById('custPhone').value = '';
    document.getElementById('custCity').value = '';
    
    displayLicenses();
}

async function deleteLicense(idx) {
    if (!confirm("مطمئنی می‌خوای این کد رو حذف کنی؟")) return;
    if (!ghToken) { alert("Token نداری!"); return; }
    
    currentData.licenses.splice(idx, 1);
    await saveToGithub();
    displayLicenses();
}

async function saveToGithub() {
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(currentData, null, 2))));
    
    try {
        const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/licenses.json`, {
            method: 'PUT',
            headers: {
                'Authorization': `token ${ghToken}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                message: 'Update licenses',
                content: content,
                sha: fileSha
            })
        });
        const data = await response.json();
        fileSha = data.content.sha;
    } catch (e) {
        alert("خطا در ذخیره: " + e.message);
    }
}

function copyCode(code) {
    navigator.clipboard.writeText(code);
    alert("✅ کد کپی شد: " + code);
}
</script>
</body>
</html>
